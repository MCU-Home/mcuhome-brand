version = 1
SPDX-PackageName = "MCUHome"
SPDX-PackageSupplier = "The MCUHome Contributors"
SPDX-PackageDownloadLocation = "https://github.com/mcu-home/mcuhome-brand"

# Fallback annotation: files carrying their own SPDX headers take
# precedence ("closest"); everything else (Markdown, logo assets,
# stylesheets, example pages) is covered here.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The MCUHome Contributors"
SPDX-License-Identifier = "Apache-2.0"
