version = 1
SPDX-PackageName = "MCUHome"
SPDX-PackageSupplier = "The MCUHome Contributors"
SPDX-PackageDownloadLocation = "https://github.com/mcu-home/mcuhome-brand"

# Fallback annotation: files carrying their own SPDX headers take
# precedence ("closest"); everything else (Markdown, stylesheets, example
# pages) is covered here.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 The MCUHome Contributors"
SPDX-License-Identifier = "Apache-2.0"

# The logo assets are not Apache-2.0: they are the project's marks and are
# governed by the brand usage policy in
# LICENSES/LicenseRef-MCUHome-Brand.txt. Stated as an override so the whole
# folder is covered by one rule — the PNG and ICO files have no comment
# syntax that could carry an SPDX header. The SVGs repeat the same header
# inline so single copies of them stay self-describing.
[[annotations]]
path = "assets/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 The MCUHome Contributors"
SPDX-License-Identifier = "LicenseRef-MCUHome-Brand"
